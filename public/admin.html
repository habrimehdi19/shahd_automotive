<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR GARAGE — Super Admin</title>
<style>body{margin:0;background:#090b0d;color:#f4f5f6;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.muted{color:#9ca3aa;font-size:13px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#ef2029;color:#fff;font-weight:700;cursor:pointer}.btn.gray{background:#252b30}.btn.danger{background:#7d1b20}.tg{background:#168bd6}.tg2{background:#0f6b4f}.status{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;background:#252b30;font-size:12px}.status.ok{background:#0f5132;color:#b7f7d2}.panel{background:#121518;border:1px solid #292e33;border-radius:14px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#9ca3aa}.field input{width:100%;box-sizing:border-box;background:#0b0e10;border:1px solid #30363b;color:#fff;border-radius:8px;padding:11px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#0d1012;border:1px solid #292e33;border-radius:12px;padding:15px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#000}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}@media(max-width:800px){.cards,.grid,.formgrid{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<div class="top"><div style="display:flex;align-items:center;gap:14px"><img src="/mr-garage-logo.png" style="width:52px;height:52px;object-fit:contain"><div><h1 style="margin:0">MR GARAGE</h1><div class="muted">Super Admin — Gestion de toutes les entreprises / garages</div></div></div><button class="btn gray" onclick="location.href='/logout'">Déconnexion</button></div>
<div class="grid"><div class="panel"><div class="muted">Garages</div><h2 id="count">0</h2></div><div class="panel"><div class="muted">Employés</div><h2 id="emps">0</h2></div><div class="panel"><div class="muted">Rendez-vous</div><h2 id="appts">0</h2></div></div>
<div class="panel"><h2>+ Nouveau garage</h2><form onsubmit="createCompany(event)"><div class="formgrid"><div class="field"><label>Nom de l'entreprise *</label><input id="name" required></div><div class="field"><label>Nom d'utilisateur *</label><input id="username" required></div><div class="field"><label>Mot de passe *</label><input id="password" type="password" required></div><div class="field"><label>Téléphone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Adresse</label><input id="address"></div><div class="field"><label>Pays</label><select id="country"></select></div><div class="field"><label>Devise</label><select id="currency"></select></div><div class="field"><label>Logo (URL optionnelle)</label><input id="logo" placeholder="/uploads/... ou URL"></div><div class="field"><label>Token du bot Telegram (optionnel)</label><input id="telegramBotToken" placeholder="1234567:AAExxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"></div></div><button class="btn" style="margin-top:14px">Créer le garage</button></form></div>
<div class="cards" id="companies"></div></div>
<script>
let companies=[];
const COUNTRY_CURRENCY={MA:'MAD',FR:'EUR',ES:'EUR',PT:'EUR',DE:'EUR',IT:'EUR',BE:'EUR',NL:'EUR',LU:'EUR',IE:'EUR',AT:'EUR',FI:'EUR',GR:'EUR',CY:'EUR',MT:'EUR',SK:'EUR',SI:'EUR',EE:'EUR',LV:'EUR',LT:'EUR',US:'USD',CA:'CAD',GB:'GBP',CH:'CHF',JP:'JPY',CN:'CNY',IN:'INR',AE:'AED',SA:'SAR',QA:'QAR',KW:'KWD',BH:'BHD',OM:'OMR',EG:'EGP',DZ:'DZD',TN:'TND',LY:'LYD',MR:'MRU',SN:'XOF',CI:'XOF',ML:'XOF',BF:'XOF',NE:'XOF',TG:'XOF',BJ:'XOF',GN:'GNF',CM:'XAF',GA:'XAF',CG:'XAF',TD:'XAF',CF:'XAF',GQ:'XAF',NG:'NGN',GH:'GHS',KE:'KES',ZA:'ZAR',TZ:'TZS',UG:'UGX',RW:'RWF',ET:'ETB',AU:'AUD',NZ:'NZD',SG:'SGD',HK:'HKD',MY:'MYR',TH:'THB',ID:'IDR',PH:'PHP',VN:'VND',KR:'KRW',TR:'TRY',PL:'PLN',CZ:'CZK',HU:'HUF',RO:'RON',BG:'BGN',HR:'EUR',RS:'RSD',UA:'UAH',NO:'NOK',SE:'SEK',DK:'DKK',IS:'ISK',RU:'RUB',BR:'BRL',MX:'MXN',AR:'ARS',CL:'CLP',CO:'COP',PE:'PEN',UY:'UYU',BO:'BOB',PY:'PYG',CR:'CRC',PA:'PAB',DO:'DOP',JM:'JMD',TT:'TTD',BS:'BSD'};
const COUNTRY_NAMES={MA:'Maroc',FR:'France',ES:'Espagne',PT:'Portugal',DE:'Allemagne',IT:'Italie',BE:'Belgique',NL:'Pays-Bas',LU:'Luxembourg',IE:'Irlande',AT:'Autriche',FI:'Finlande',GR:'Grèce',CY:'Chypre',MT:'Malte',SK:'Slovaquie',SI:'Slovénie',EE:'Estonie',LV:'Lettonie',LT:'Lituanie',US:'États-Unis',CA:'Canada',GB:'Royaume-Uni',CH:'Suisse',JP:'Japon',CN:'Chine',IN:'Inde',AE:'Émirats arabes unis',SA:'Arabie saoudite',QA:'Qatar',KW:'Koweït',BH:'Bahreïn',OM:'Oman',EG:'Égypte',DZ:'Algérie',TN:'Tunisie',LY:'Libye',MR:'Mauritanie',SN:'Sénégal',CI:"Côte d’Ivoire",ML:'Mali',BF:'Burkina Faso',NE:'Niger',TG:'Togo',BJ:'Bénin',GN:'Guinée',CM:'Cameroun',GA:'Gabon',CG:'Congo',TD:'Tchad',CF:'République centrafricaine',GQ:'Guinée équatoriale',NG:'Nigeria',GH:'Ghana',KE:'Kenya',ZA:'Afrique du Sud',TZ:'Tanzanie',UG:'Ouganda',RW:'Rwanda',ET:'Éthiopie',AU:'Australie',NZ:'Nouvelle-Zélande',SG:'Singapour',HK:'Hong Kong',MY:'Malaisie',TH:'Thaïlande',ID:'Indonésie',PH:'Philippines',VN:'Vietnam',KR:'Corée du Sud',TR:'Turquie',PL:'Pologne',CZ:'Tchéquie',HU:'Hongrie',RO:'Roumanie',BG:'Bulgarie',HR:'Croatie',RS:'Serbie',UA:'Ukraine',NO:'Norvège',SE:'Suède',DK:'Danemark',IS:'Islande',RU:'Russie',BR:'Brésil',MX:'Mexique',AR:'Argentine',CL:'Chili',CO:'Colombie',PE:'Pérou',UY:'Uruguay',BO:'Bolivie',PY:'Paraguay',CR:'Costa Rica',PA:'Panama',DO:'République dominicaine',JM:'Jamaïque',TT:'Trinité-et-Tobago',BS:'Bahamas'};
const CURRENCY_NAMES={AED:'AED — Dirham des Émirats arabes unis',AFN:'AFN — Afghani',ALL:'ALL — Lek albanais',AMD:'AMD — Dram arménien',ANG:'ANG — Florin antillais',AOA:'AOA — Kwanza',ARS:'ARS — Peso argentin',AUD:'AUD — Dollar australien',AWG:'AWG — Florin arubais',AZN:'AZN — Manat azerbaïdjanais',BAM:'BAM — Mark convertible',BBD:'BBD — Dollar barbadien',BDT:'BDT — Taka bangladais',BGN:'BGN — Lev bulgare',BHD:'BHD — Dinar bahreïni',BIF:'BIF — Franc burundais',BMD:'BMD — Dollar bermudien',BND:'BND — Dollar de Brunei',BOB:'BOB — Boliviano',BRL:'BRL — Réal brésilien',BSD:'BSD — Dollar bahaméen',BTN:'BTN — Ngultrum',BWP:'BWP — Pula',BYN:'BYN — Rouble biélorusse',BZD:'BZD — Dollar bélizien',CAD:'CAD — Dollar canadien',CDF:'CDF — Franc congolais',CHF:'CHF — Franc suisse',CLP:'CLP — Peso chilien',CNY:'CNY — Yuan chinois',COP:'COP — Peso colombien',CRC:'CRC — Colón costaricien',CUP:'CUP — Peso cubain',CVE:'CVE — Escudo cap-verdien',CZK:'CZK — Couronne tchèque',DJF:'DJF — Franc djiboutien',DKK:'DKK — Couronne danoise',DOP:'DOP — Peso dominicain',DZD:'DZD — Dinar algérien',EGP:'EGP — Livre égyptienne',ERN:'ERN — Nakfa',ETB:'ETB — Birr éthiopien',EUR:'EUR — Euro',FJD:'FJD — Dollar fidjien',FKP:'FKP — Livre des Falkland',GBP:'GBP — Livre sterling',GEL:'GEL — Lari géorgien',GHS:'GHS — Cedi ghanéen',GIP:'GIP — Livre de Gibraltar',GMD:'GMD — Dalasi gambien',GNF:'GNF — Franc guinéen',GTQ:'GTQ — Quetzal',GYD:'GYD — Dollar guyanien',HKD:'HKD — Dollar de Hong Kong',HNL:'HNL — Lempira',HTG:'HTG — Gourde haïtienne',HUF:'HUF — Forint',IDR:'IDR — Roupie indonésienne',ILS:'ILS — Shekel israélien',INR:'INR — Roupie indienne',IQD:'IQD — Dinar irakien',IRR:'IRR — Rial iranien',ISK:'ISK — Couronne islandaise',JMD:'JMD — Dollar jamaïcain',JOD:'JOD — Dinar jordanien',JPY:'JPY — Yen japonais',KES:'KES — Shilling kényan',KGS:'KGS — Som kirghize',KHR:'KHR — Riel cambodgien',KMF:'KMF — Franc comorien',KPW:'KPW — Won nord-coréen',KRW:'KRW — Won sud-coréen',KWD:'KWD — Dinar koweïtien',KYD:'KYD — Dollar des îles Caïmans',KZT:'KZT — Tenge',LAK:'LAK — Kip',LBP:'LBP — Livre libanaise',LKR:'LKR — Roupie sri-lankaise',LRD:'LRD — Dollar libérien',LSL:'LSL — Loti',LYD:'LYD — Dinar libyen',MAD:'MAD — Dirham marocain',MDL:'MDL — Leu moldave',MGA:'MGA — Ariary malgache',MKD:'MKD — Denar macédonien',MMK:'MMK — Kyat',MNT:'MNT — Tugrik mongol',MOP:'MOP — Pataca de Macao',MRU:'MRU — Ouguiya mauritanien',MUR:'MUR — Roupie mauricienne',MVR:'MVR — Rufiyaa',MWK:'MWK — Kwacha malawien',MXN:'MXN — Peso mexicain',MYR:'MYR — Ringgit malaisien',MZN:'MZN — Metical mozambicain',NAD:'NAD — Dollar namibien',NGN:'NGN — Naira nigérian',NIO:'NIO — Córdoba',NOK:'NOK — Couronne norvégienne',NPR:'NPR — Roupie népalaise',NZD:'NZD — Dollar néo-zélandais',OMR:'OMR — Rial omanais',PAB:'PAB — Balboa panaméen',PEN:'PEN — Sol péruvien',PGK:'PGK — Kina',PHP:'PHP — Peso philippin',PKR:'PKR — Roupie pakistanaise',PLN:'PLN — Zloty polonais',PYG:'PYG — Guarani',QAR:'QAR — Riyal qatari',RON:'RON — Leu roumain',RSD:'RSD — Dinar serbe',RUB:'RUB — Rouble russe',RWF:'RWF — Franc rwandais',SAR:'SAR — Riyal saoudien',SBD:'SBD — Dollar des Salomon',SCR:'SCR — Roupie des Seychelles',SDG:'SDG — Livre soudanaise',SEK:'SEK — Couronne suédoise',SGD:'SGD — Dollar de Singapour',SHP:'SHP — Livre de Sainte-Hélène',SLE:'SLE — Leone sierra-léonais',SOS:'SOS — Shilling somalien',SRD:'SRD — Dollar surinamais',SSP:'SSP — Livre sud-soudanaise',STN:'STN — Dobra',SYP:'SYP — Livre syrienne',SZL:'SZL — Lilangeni',THB:'THB — Baht thaïlandais',TJS:'TJS — Somoni',TMT:'TMT — Manat turkmène',TND:'TND — Dinar tunisien',TOP:'TOP — Paʻanga',TRY:'TRY — Livre turque',TTD:'TTD — Dollar de Trinité-et-Tobago',TWD:'TWD — Nouveau dollar taïwanais',TZS:'TZS — Shilling tanzanien',UAH:'UAH — Hryvnia',UGX:'UGX — Shilling ougandais',USD:'USD — Dollar américain',UYU:'UYU — Peso uruguayen',UZS:'UZS — Sum ouzbek',VES:'VES — Bolívar vénézuélien',VND:'VND — Dong vietnamien',VUV:'VUV — Vatu',WST:'WST — Tala',XAF:'XAF — Franc CFA BEAC',XCD:'XCD — Dollar des Caraïbes orientales',XOF:'XOF — Franc CFA BCEAO',XPF:'XPF — Franc CFP',YER:'YER — Rial yéménite',ZAR:'ZAR — Rand sud-africain',ZMW:'ZMW — Kwacha zambien',ZWL:'ZWL — Dollar zimbabwéen'};
function initCurrencySelectors(){const cs=document.getElementById('country'),cu=document.getElementById('currency');if(!cs||!cu)return;cs.innerHTML='<option value="">— Choisir un pays —</option>'+Object.entries(COUNTRY_NAMES).sort((a,b)=>a[1].localeCompare(b[1])).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');cu.innerHTML=Object.entries(CURRENCY_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');cs.value='MA';cu.value='MAD';cs.onchange=()=>{const cur=COUNTRY_CURRENCY[cs.value];if(cur)cu.value=cur;};}
 const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){const r=await fetch('/admin/api/companies');if(!r.ok){location.href='/admin/login';return}companies=await r.json();document.getElementById('count').textContent=companies.length;document.getElementById('emps').textContent=companies.reduce((n,c)=>n+c.employees,0);document.getElementById('appts').textContent=companies.reduce((n,c)=>n+c.appointments,0);render()}
function render(){document.getElementById('companies').innerHTML=companies.map(c=>`<div class="card"><div class="brand"><img src="${esc(c.logo||'/mr-garage-logo.png')}" onerror="this.src='/mr-garage-logo.png'"><div><h3 style="margin:0">${esc(c.name)}</h3><div class="muted">${esc(c.username)} · ${c.active?'🟢 Actif':'🔴 Désactivé'}</div></div></div><div class="muted" style="margin-top:12px">${esc(c.phone)} ${c.email?'· '+esc(c.email):''}<br>${esc(c.address)}<br>🌍 ${esc(c.country||'MA')} · 💱 ${esc(c.currency||'MAD')}</div><div class="status ${c.botRunning?'ok':''}">${c.botRunning?'🤖 Bot Telegram actif':(c.hasBotToken?'⚪ Token enregistré, bot arrêté':'⚪ Aucun bot Telegram')}</div><div class="actions"><button class="btn tg" onclick="editBotToken('${c.id}')">Bot Telegram</button><button class="btn gray" onclick="editCompany('${c.id}')">Modifier</button><button class="btn gray" onclick="logoCompany('${c.id}')">Changer logo</button><button class="btn gray" onclick="toggleCompany('${c.id}')">${c.active?'Désactiver':'Activer'}</button>${c.id!=='company_default'?`<button class="btn danger" onclick="deleteCompany('${c.id}')">Supprimer</button>`:''}</div></div>`).join('')}
async function createCompany(e){e.preventDefault();const body={name:document.getElementById('name').value.trim(),username:document.getElementById('username').value.trim(),password:document.getElementById('password').value,phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),address:document.getElementById('address').value.trim(),country:document.getElementById('country').value,currency:document.getElementById('currency').value,logo:document.getElementById('logo').value.trim(),telegramBotToken:document.getElementById('telegramBotToken').value.trim()};const r=await fetch('/admin/api/companies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert((await r.json()).error);return}e.target.reset();load()}
async function editBotToken(id){const c=companies.find(x=>x.id===id);if(!c)return;const info=c.botRunning?'البوت خدام دابا.':(c.hasBotToken?'كاين توكن مسجل ولكن البوت واقف (تأكد التوكن صحيح).':'ماكاين حتى بوت لهاد الورشة.');const token=prompt(`${info}\\n\\nحط توكن جديد ديال بوت Telegram (من @BotFather)، أو خلي فارغ باش تحيد البوت الحالي:`,'');if(token===null)return;const r=await fetch('/admin/api/companies/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegramBotToken:token.trim()})});if(!r.ok){alert((await r.json()).error);return}load()}
async function editCompany(id){const c=companies.find(x=>x.id===id);if(!c)return;const name=prompt('Nom de l’entreprise',c.name);if(name===null)return;const username=prompt('Nom d’utilisateur',c.username);if(username===null)return;const password=prompt('Nouveau mot de passe (laisser vide pour garder)','');const phone=prompt('Téléphone',c.phone||'');const email=prompt('Email',c.email||'');const address=prompt('Adresse',c.address||'');const country=prompt('Pays (code ISO, ex. MA, FR, ES, US)',c.country||'MA');if(country===null)return;const currency=prompt('Devise (code ISO, ex. MAD, EUR, USD)',c.currency||'MAD');if(currency===null)return;const body={name,username,phone,email,address,country,currency};if(password)body.password=password;const r=await fetch('/admin/api/companies/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)alert((await r.json()).error);load()}
async function toggleCompany(id){await fetch('/admin/api/companies/'+id+'/toggle',{method:'POST'});load()}
async function deleteCompany(id){if(!confirm('Supprimer ce garage ?'))return;const r=await fetch('/admin/api/companies/'+id,{method:'DELETE'});if(!r.ok)alert((await r.json()).error);load()}
async function logoCompany(id){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{const fd=new FormData();fd.append('logo',input.files[0]);const r=await fetch('/admin/api/companies/'+id+'/logo',{method:'POST',body:fd});if(!r.ok)alert((await r.json()).error);load()};input.click()}
initCurrencySelectors();load();
</script></body></html>
