<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace employé — SHAHD AUTOMOTIVE</title>
<style>:root{--bg:#090b0d;--panel:#121518;--line:#292e33;--red:#ef2029;--text:#f4f5f6;--muted:#9ca3aa;--green:#25c66b;--blue:#28a9ff;--yellow:#f4b51b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:cover;border-radius:10px}.brand h1{font-size:20px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.logout{background:transparent;border:1px solid #7d1b20;color:#ff3a42;padding:10px 14px;border-radius:8px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.stat,.card{background:linear-gradient(145deg,#15191d,#101316);border:1px solid var(--line);border-radius:12px}.stat{padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px}.card{padding:16px}.card h2{font-size:15px;margin:0 0 14px;border-left:3px solid var(--red);padding-left:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.vehicle{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#0d1012}.vehicle:last-child{margin-bottom:0}.vhead{display:flex;justify-content:space-between;gap:10px}.vhead h3{margin:0;font-size:16px}.muted{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:6px;font-size:11px;background:#3a2d0b;color:#f7c63d}.badge.blue{background:#102e43;color:#51b9ff}.badge.green{background:#123820;color:#49d884}.issue{margin:10px 0;padding:10px;border-left:3px solid var(--red);background:#171a1d;font-size:13px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;border-radius:7px;padding:9px 11px;background:#252b30;color:#fff;cursor:pointer}.actions button.primary{background:var(--red)}.empty{color:var(--muted);padding:15px 0}.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.photos img{width:70px;height:55px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.error{color:#ff7070;text-align:center;padding:20px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(380px,100%);background:#121518;border:1px solid var(--line);border-radius:14px;padding:26px}.loginbox h1{margin:0 0 8px;font-size:20px}.loginbox p{color:var(--muted);font-size:13px;margin:0 0 20px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted)}.field input{width:100%;background:#0b0e10;border:1px solid #30363b;color:#fff;border-radius:8px;padding:12px;outline:none}.loginbox button{width:100%;background:var(--red);border:0;color:#fff;padding:13px;border-radius:8px;font-weight:700;cursor:pointer}.loginerr{color:#ff6b6b;font-size:13px;margin-bottom:12px}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}.top{align-items:flex-start}.details{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script>
let me=null, appointments=[];
const app=document.getElementById('app');
function loginView(err=''){app.innerHTML=`<div class="login"><form class="loginbox" onsubmit="login(event)"><h1>🔒 SHAHD AUTOMOTIVE</h1><p>Espace sécurisé des employés</p>${err?`<div class="loginerr">${err}</div>`:''}<div class="field"><label>Login</label><input id="login" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button>Se connecter</button></form></div>`}
async function login(e){e.preventDefault();const r=await fetch('/employee/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login').value.trim(),password:document.getElementById('password').value})});if(r.ok){await load();}else{let msg='Login ou password incorrect.';try{const d=await r.json();if(d.error)msg=d.error}catch{}loginView(msg);}}
async function logout(){await fetch('/employee/logout',{method:'POST',credentials:'same-origin'});loginView();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function badge(s){let c=s==='En cours'?'blue':s==='Terminé'?'green':'';return `<span class="badge ${c}">${esc(s||'En attente')}</span>`}
function card(a){return `<div class="vehicle"><div class="vhead"><div><h3>🚗 ${esc(a.car)}</h3><div class="muted">${esc(a.name)}${a.phone?' · '+esc(a.phone):''}</div></div>${badge(a.status)}</div><div class="issue"><b>Problème :</b> ${esc(a.issue||'-')}</div><div class="details"><div><b>Service</b><br>${esc(a.service||'-')}</div><div><b>Date / heure</b><br>${esc(a.date||'-')} · ${esc(a.time||'-')}</div></div>${(a.photosBefore?.length||a.photosAfter?.length)?`<div class="photos">${[...(a.photosBefore||[]),...(a.photosAfter||[])].map(u=>`<img src="${esc(u)}" alt="Photo">`).join('')}</div>`:''}<div class="actions"><button class="primary" onclick="setStatus(${a.id},'En cours')">Démarrer</button><button onclick="setStatus(${a.id},'Terminé')">Terminé</button></div></div>`}
function render(){const pending=appointments.filter(a=>a.status!=='Terminé'&&a.status!=='Annulé').length;app.innerHTML=`<div class="wrap"><header class="top"><div class="brand"><div><h1>SHAHD AUTOMOTIVE</h1><p>Espace employé · ${esc(me.name)}</p></div></div><button class="logout" onclick="logout()">↪ Déconnexion</button></header><div class="stats"><div class="stat"><small>Mes véhicules</small><strong>${appointments.length}</strong></div><div class="stat"><small>À traiter</small><strong>${pending}</strong></div><div class="stat"><small>Terminés</small><strong>${appointments.filter(a=>a.status==='Terminé').length}</strong></div></div><div class="grid"><div class="card"><h2>MES VÉHICULES / INTERVENTIONS</h2>${appointments.length?appointments.map(card).join(''):'<div class="empty">Aucun véhicule ne vous est assigné.</div>'}</div><div class="card"><h2>PROBLÈMES À TRAITER</h2>${appointments.filter(a=>a.status!=='Terminé'&&a.status!=='Annulé').length?appointments.filter(a=>a.status!=='Terminé'&&a.status!=='Annulé').map(card).join(''):'<div class="empty">Aucun problème en attente.</div>'}</div></div></div>`}
async function setStatus(id,status){const r=await fetch('/employee/api/appointments/'+id,{credentials:'same-origin',method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(r.ok)load();else if(r.status===401)loginView();}
async function load(){const r=await fetch('/employee/api/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok){loginView();return}const d=await r.json();me=d.employee;appointments=d.appointments||[];render()}
load();
</script></body></html>
